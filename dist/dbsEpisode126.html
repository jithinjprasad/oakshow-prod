  <title>Dragon Ball Super Episode 126: Surpass Even a God! Vegeta&#039;s Sacrifice Strike! All Ratings, Reviews &amp; Synopsis — OakShow</title>
  <meta name="description" content="Top easily overpowers Android 17&#039;s blast. Android 17 is able to evade him for a while by using the broken fighting stage to his advantage, but Top effortlessly withstands Android 17&#039;s attacks. Top prepares to eliminate Android 17 with a giant energy blast, but Frieza rejoins the battle and deflects Top&#039;s attack. Frieza uses his own energy attack to immobilize Top, which allows him and Android. 17 to land numerous attacks, but none of them have any effect. Top is about to eliminate them both, when he is interrupted by Goku and Vegeta, who are still fighting Jiren. Frieza and Android 17 are hit by one of Jiren&#039;s attacks, which gives Top the opportunity to attack Vegeta instead. Top overwhelms Vegeta with his new power and states that he has cast aside everything else in order to become strong enough to win the tournament. However, Vegeta is inspired by his family, his promise to Cabba, and his Saiyan pride, and he refuses to cast anything aside. Vegeta then unleashes his full power and overwhelms Top. Vegeta and Top both use their ultimate attacks: Top unleashes his Energy of Destruction, while Vegeta uses the Final Explosion technique that he used against Majin Buu. Vegeta&#039;s attack overwhelms Top&#039;s attack, blasts Top out of the fighting stage, and eliminates him from the tournament. This also causes even more damage to the fighting stage. Due to Vegeta being much stronger than he was the last time he used the Final Explosion technique, he survives the blast, but his energy is almost completely drained. Android 17 also reappears, but he has been injured by Jiren&#039;s attack. Goku, Vegeta, and Android 17 all face off against Jiren, who begins to unleash his full power. Source:Wikipedia" />

<h1>Dragon Ball Super Episode 126: Surpass Even a God! Vegeta&#039;s Sacrifice Strike! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>Top easily overpowers Android 17&#039;s blast. Android 17 is able to evade him for a while by using the broken fighting stage to his advantage, but Top effortlessly withstands Android 17&#039;s attacks. Top prepares to eliminate Android 17 with a giant energy blast, but Frieza rejoins the battle and deflects Top&#039;s attack. Frieza uses his own energy attack to immobilize Top, which allows him and Android. 17 to land numerous attacks, but none of them have any effect. Top is about to eliminate them both, when he is interrupted by Goku and Vegeta, who are still fighting Jiren. Frieza and Android 17 are hit by one of Jiren&#039;s attacks, which gives Top the opportunity to attack Vegeta instead. Top overwhelms Vegeta with his new power and states that he has cast aside everything else in order to become strong enough to win the tournament. However, Vegeta is inspired by his family, his promise to Cabba, and his Saiyan pride, and he refuses to cast anything aside. Vegeta then unleashes his full power and overwhelms Top. Vegeta and Top both use their ultimate attacks: Top unleashes his Energy of Destruction, while Vegeta uses the Final Explosion technique that he used against Majin Buu. Vegeta&#039;s attack overwhelms Top&#039;s attack, blasts Top out of the fighting stage, and eliminates him from the tournament. This also causes even more damage to the fighting stage. Due to Vegeta being much stronger than he was the last time he used the Final Explosion technique, he survives the blast, but his energy is almost completely drained. Android 17 also reappears, but he has been injured by Jiren&#039;s attack. Goku, Vegeta, and Android 17 all face off against Jiren, who begins to unleash his full power. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
