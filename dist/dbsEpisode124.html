  <title>Dragon Ball Super Episode 124: A Storm-and-Stress Assault! Gohan&#039;s Last Stand! All Ratings, Reviews &amp; Synopsis — OakShow</title>
  <meta name="description" content="As Goku and Vegeta continue their battle with Jiren, the battle between Dyspo and Frieza intensifies. The two seem evenly matched, until Frieza breaks off the fight and offers to help Universe Eleven win the tournament if they promise to resurrect him with the Super Dragon Balls. Dyspo refuses the offer, so Frieza powers up to his Golden form and gains the advantage in the fight. Dyspo reveals his own ultimate technique, the Super Maximum Light Speed Mode, which increases his power and speed even further, and overwhelms Frieza. Gohan and Android 17 realize that Frieza is in danger of being knocked off the fighting stage, so Android 17 distracts Top, while Gohan goes to Frieza&#039;s aid. Gohan and Frieza take on Dyspo as a team, but they have little success. Gohan develops a strategy that has Frieza use his energy to form a cage around Dyspo, which prevents him from using his high-speed attacks and allows Gohan to gain the upper hand. Unfortunately, Frieza runs out of energy, and the cage dissolves before Gohan can land the finishing blow. However, Gohan is able to grab Dyspo and hold him in place, while Frieza launches a blast that knocks them off the fighting stage and eliminates them both from the tournament. Source:Wikipedia" />
