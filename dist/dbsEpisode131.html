  <title>Dragon Ball Super Episode 131: The Miraculous Conclusion! Farewell, Goku! Until We Meet Again! All Ratings, Reviews &amp; Synopsis — OakShow</title>
  <meta name="description" content="With Goku down, Frieza and Android 17 face off against Jiren. While Frieza takes the lead in the attack, Android 17 manages to injure Jiren with another surprise attack, who collapses from exhaustion. Frieza is about to eliminate Jiren, who accepts his impending defeat, but Top calls out to Jiren and inspires him to keep fighting despite his injuries. Jiren powers up into his limit-breaking state again and fires a massive blast at Frieza and Android 17. They form an energy barrier to shield themselves, but Frieza is running low on energy and drops out of his Golden form. Before Jiren can overpower them, Goku manages to get back up and rejoins the others. Goku adds his strength to the barrier, which enables them to cancel out Jiren&#039;s blast. Goku and Frieza take on Jiren together, while Android 17 provides cover fire. Working together, Goku and Frieza overpower Jiren and tackle him out of the ring, which eliminates three of them from the tournament. With all of their fighters defeated, Universe Eleven is erased. As the only fighter remaining on the fighting stage, Android 17 is declared the winner of the Tournament of Power, and he is given the privilege of getting his wish granted from the Super Dragon Balls. After some consideration, Android 17 wishes to restore all of the universes that had been erased, which brings all their inhabitants back to life. As the erased universes are restored, the Grand Minister reveals that Grand Zenō and Future Grand Zenō had foreseen the outcome of a virtuous being winning the Tournament of Power who would make a selfless wish on the Super Dragon Balls. He also stated that if the winner had made a selfish wish instead, they would have erased the entire multiverse, as this would have shown that the winning universe was no better than the erased universes and that the universes excluded from the tournament were no more worthy of existing. As a reward for doing well in the tournament, Beerus asks Whis to restore Frieza to life. In Universe Eleven, Jiren establishes a real friendship with Top and looks forward to having a rematch with Goku someday. The group from Universe Seven return home. Frieza leaves Earth and resumes leadership of his empire, though Goku vows to defeat him if he starts causing trouble again. Goku and Vegeta meet for a sparring match in the place where they first fought, and they enter their Super Saiyan Blue forms. Goku reveals that he cannot achieve Ultra Instinct at will, and believes that he obtained it by accident during the tournament. Goku and Vegeta declare that they will keep finding new levels of strength, and they race towards each other to fight. Source:Wikipedia" />

<h1>Dragon Ball Super Episode 131: The Miraculous Conclusion! Farewell, Goku! Until We Meet Again! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>With Goku down, Frieza and Android 17 face off against Jiren. While Frieza takes the lead in the attack, Android 17 manages to injure Jiren with another surprise attack, who collapses from exhaustion. Frieza is about to eliminate Jiren, who accepts his impending defeat, but Top calls out to Jiren and inspires him to keep fighting despite his injuries. Jiren powers up into his limit-breaking state again and fires a massive blast at Frieza and Android 17. They form an energy barrier to shield themselves, but Frieza is running low on energy and drops out of his Golden form. Before Jiren can overpower them, Goku manages to get back up and rejoins the others. Goku adds his strength to the barrier, which enables them to cancel out Jiren&#039;s blast. Goku and Frieza take on Jiren together, while Android 17 provides cover fire. Working together, Goku and Frieza overpower Jiren and tackle him out of the ring, which eliminates three of them from the tournament. With all of their fighters defeated, Universe Eleven is erased. As the only fighter remaining on the fighting stage, Android 17 is declared the winner of the Tournament of Power, and he is given the privilege of getting his wish granted from the Super Dragon Balls. After some consideration, Android 17 wishes to restore all of the universes that had been erased, which brings all their inhabitants back to life. As the erased universes are restored, the Grand Minister reveals that Grand Zenō and Future Grand Zenō had foreseen the outcome of a virtuous being winning the Tournament of Power who would make a selfless wish on the Super Dragon Balls. He also stated that if the winner had made a selfish wish instead, they would have erased the entire multiverse, as this would have shown that the winning universe was no better than the erased universes and that the universes excluded from the tournament were no more worthy of existing. As a reward for doing well in the tournament, Beerus asks Whis to restore Frieza to life. In Universe Eleven, Jiren establishes a real friendship with Top and looks forward to having a rematch with Goku someday. The group from Universe Seven return home. Frieza leaves Earth and resumes leadership of his empire, though Goku vows to defeat him if he starts causing trouble again. Goku and Vegeta meet for a sparring match in the place where they first fought, and they enter their Super Saiyan Blue forms. Goku reveals that he cannot achieve Ultra Instinct at will, and believes that he obtained it by accident during the tournament. Goku and Vegeta declare that they will keep finding new levels of strength, and they race towards each other to fight. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
