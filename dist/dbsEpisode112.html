  <title>Dragon Ball Super Episode 112: A Saiyan Oath! Vegeta&#039;s Resolve! All Ratings, Reviews &amp; Synopsis — OakShow</title>
  <meta name="description" content="Despite his exhaustion and low energy, Goku is determined to keep fighting. However, he is suddenly targeted by Koitsukai , Panchia , and Bollarator of Universe 3. Gohan and Piccolo want to help him, but they are distracted by their own battle with Saonel and Pilina. Caulifla and Kale are discussing the battle between Goku and Jiren, when they are confronted by Monna, a female warrior from Universe 4. Caulifla faces off against Monna, but Cabba appears and takes her place. He instructs Caulifla and Kale to retreat for now. Cabba turns Super Saiyan and battles Monna, but he is initially overpowered. Monna almost knocks Cabba off the stage, but Vegeta intervenes and catches him before he can fall. Vegeta and Cabba both promise that, if either of them wins the tournament, the winner will use the Super Dragon Balls to restore the other&#039;s erased universe and its inhabitants. Newly inspired, Cabba fights Monna again, but he is losing until he taps into his anger and unlocks Super Saiyan 2. With his new power, Cabba easily defeats and eliminates Monna. However, Frieza appears, fights Cabba, and easily eliminates him as well. Frieza reveals that he plans to win the tournament in order to use the Super Dragon Balls to control the gods. Meanwhile, Vegeta decides to challenge Jiren, but he is intercepted by Top. The two battle each other. Vegeta ends up meeting up with Goku, who is still having difficulty with his three opponents. However, Caulifla intervenes and knocks Koitsukai, Borareta, and Pancea away before powering up to Super Saiyan 2 and challenging Goku herself. Source:Wikipedia" />

<h1>Dragon Ball Super Episode 112: A Saiyan Oath! Vegeta&#039;s Resolve! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>Despite his exhaustion and low energy, Goku is determined to keep fighting. However, he is suddenly targeted by Koitsukai , Panchia , and Bollarator of Universe 3. Gohan and Piccolo want to help him, but they are distracted by their own battle with Saonel and Pilina. Caulifla and Kale are discussing the battle between Goku and Jiren, when they are confronted by Monna, a female warrior from Universe 4. Caulifla faces off against Monna, but Cabba appears and takes her place. He instructs Caulifla and Kale to retreat for now. Cabba turns Super Saiyan and battles Monna, but he is initially overpowered. Monna almost knocks Cabba off the stage, but Vegeta intervenes and catches him before he can fall. Vegeta and Cabba both promise that, if either of them wins the tournament, the winner will use the Super Dragon Balls to restore the other&#039;s erased universe and its inhabitants. Newly inspired, Cabba fights Monna again, but he is losing until he taps into his anger and unlocks Super Saiyan 2. With his new power, Cabba easily defeats and eliminates Monna. However, Frieza appears, fights Cabba, and easily eliminates him as well. Frieza reveals that he plans to win the tournament in order to use the Super Dragon Balls to control the gods. Meanwhile, Vegeta decides to challenge Jiren, but he is intercepted by Top. The two battle each other. Vegeta ends up meeting up with Goku, who is still having difficulty with his three opponents. However, Caulifla intervenes and knocks Koitsukai, Borareta, and Pancea away before powering up to Super Saiyan 2 and challenging Goku herself. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
