<h1>Dragon Ball Super Episode 127: The Approaching Wall! A Hopeful Final Barrier! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>Jiren powers up to his maximum. Goku, Vegeta, and Android 17 all attack him simultaneously, but he easily overpowers them. However, Android 17 manages to land a sneak attack and hurts Jiren. Jiren defeats Goku and Vegeta, while Frieza rejoins the fight and tries to kill Jiren in his golden form. However, Frieza is easily defeated as well and knocked out once again. Android 17 asks Jiren what his wish on the Super Dragon Balls would be, and Belmod explains that Jiren&#039;s endless pursuit of strength was inspired when his parents, most of his comrades, and mentor were killed by a powerful villain. However, his abandonment by his surviving friends turned Jiren into a loner who distrusted friendship, and he now focuses solely on increasing his own strength. This allows Android 17 to figure out Jiren&#039;s wish - to resurrect his former master. Android 17 admires Jiren&#039;s human qualities, but he accuses Jiren of using the rest of his universe&#039;s team for his own ends. Jiren rebuffs him and fires a powerful energy blast down at Android 17, Goku, and Vegeta. Android 17 uses an energy barrier to hold back Jiren&#039;s blast and forms force fields around Goku and Vegeta to protect them, before unleashing all of his energy to destroy Jiren&#039;s blast, seemingly self-destructing. Injured and exhausted, Goku is unable to stand. Despite his exhausted state, Vegeta manages to get up faces off against Jiren, declaring that he will defeat him. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
