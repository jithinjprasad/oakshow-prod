    (function() {
      try {
        var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || (window.innerWidth && window.innerWidth <= 1080);
        var savedTheme = localStorage.getItem('oakshow_theme');
        // Ensure dark theme is default on mobile and clear any stale 'light' setting
        if (isMobile && savedTheme === 'light') {
          try { localStorage.removeItem('oakshow_theme'); } catch(e) {}
          savedTheme = null;
        }
        var t = savedTheme || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;

        // Immediately sync mobile browser theme-color status bar before initial paint
        var themeColor = (t === 'light') ? '#ffffff' : '#030813';
        var metaTheme = document.getElementById('theme-color-meta') || document.querySelector('meta[name="theme-color"]');
        if (metaTheme) {
          metaTheme.setAttribute('content', themeColor);
        }

        // Synchronously derive and set initial document.title before Analytics loads
        var path = window.location.pathname || '';
        var rawSlug = path.replace(/^\/+|\.html$/gi, '').replace(/^(movies|series|films)\//i, '');
        if (rawSlug && rawSlug !== 'index' && rawSlug !== 'home' && rawSlug !== 'discover') {
          var readable = rawSlug.replace(/([a-z])([A-Z])/g, '$1 $2').replace(/[-_]/g, ' ');
          document.title = readable + ' All Ratings, Reviews and Watch Online — OakShow';
        }
      } catch(e) {}
    })();
