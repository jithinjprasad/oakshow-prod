<h1>Dragon Ball Super Episode 115: Goku vs. Kefla! Super Saiyan Blue Beaten? All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>As Vegeta continues to fight Top, Gohan and Piccolo are engaged with Saonel and Pirina. Android 18 is attacked by Katopesla, but she is saved by Android 17. Meanwhile, Goku continues his fight with Kefla. The Grand Zenō and Future Grand Zenō approve Kefla&#039;s use of the Potara earrings. The other universes consider giving the Potara to their warriors as well. Pell, the Supreme Kai of Universe 2, gives his Potara to Rabanra and Zarbuto, but the earrings are destroyed by Kefla charging through them to continue fighting Goku. The battle becomes intense with Kefla gaining the upper hand. Goku powers up to Super Saiyan Blue, but Kefla counters by powering up to Super Saiyan. However, Goku uses the Kaioken and regains the advantage. He appears to be winning, but Kefla lands a sneak attack that knocks him out of Super Saiyan Blue. She prepares to eliminate him, but Goku unexpectedly reawakens Ultra Instinct again and easily dodges her attacks. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
