  <title>Dragon Ball Super Episode 104: A Transcendent Light-Speed Battle Erupts! Goku and Hit&#039;s United Front! All Ratings, Reviews &amp; Synopsis — OakShow</title>
  <meta name="description" content="Dyspo challenges Hit and uses his incredible speed to overwhelm Hit&#039;s Time Skip. Everyone quickly deduces that Dyspo is listening for the sound of Hit&#039;s body tensing up to determine when he is about to attempt to use Time Skip. Hit resorts to fighting him conventionally, but he is pushed to the edge of the stage. Top deduces that Hit has adjusted to Dyspo&#039;s fighting style and is luring him into a trap. Top sends fellow pride trooper Kunshi (クンシー Kunshī) to back him up. Before Dyspo can land the finishing blow, Hit suddenly turns intangible and sends Dyspo over the edge. However, Kunshi uses ropes made of his energy to pull Dyspo back onto the stage before he is eliminated. The two launch a renewed assault against Hit and drive him into a corner. Before they can finish him off, Goku interferes and rescues Hit, reusing his Super Saiyan God form (for the first time in a while) to counter Dyspo&#039;s speed, while Hit uses his assassination technique to injure Kunshi. The two switch places. Hit uses a fake Time Skip to throw Dyspo off and wound him, while Goku overwhelms Kunshi with his Super Saiyan Blue form. Hit attempts to eliminate Dyspo, but Kunshi rescues him again. Kunshi charges Hit, who turns intangible and knocks him off the stage. Dyspo retreats and regroups with his allies. Top abandons all notions of justice and decides to focus on survival. Hit decides not to battle Goku as thanks for lending a hand. Goku and Hit vow to settle their score if they both make it to the end of the tournament. Source:Wikipedia" />

<h1>Dragon Ball Super Episode 104: A Transcendent Light-Speed Battle Erupts! Goku and Hit&#039;s United Front! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>Dyspo challenges Hit and uses his incredible speed to overwhelm Hit&#039;s Time Skip. Everyone quickly deduces that Dyspo is listening for the sound of Hit&#039;s body tensing up to determine when he is about to attempt to use Time Skip. Hit resorts to fighting him conventionally, but he is pushed to the edge of the stage. Top deduces that Hit has adjusted to Dyspo&#039;s fighting style and is luring him into a trap. Top sends fellow pride trooper Kunshi (クンシー Kunshī) to back him up. Before Dyspo can land the finishing blow, Hit suddenly turns intangible and sends Dyspo over the edge. However, Kunshi uses ropes made of his energy to pull Dyspo back onto the stage before he is eliminated. The two launch a renewed assault against Hit and drive him into a corner. Before they can finish him off, Goku interferes and rescues Hit, reusing his Super Saiyan God form (for the first time in a while) to counter Dyspo&#039;s speed, while Hit uses his assassination technique to injure Kunshi. The two switch places. Hit uses a fake Time Skip to throw Dyspo off and wound him, while Goku overwhelms Kunshi with his Super Saiyan Blue form. Hit attempts to eliminate Dyspo, but Kunshi rescues him again. Kunshi charges Hit, who turns intangible and knocks him off the stage. Dyspo retreats and regroups with his allies. Top abandons all notions of justice and decides to focus on survival. Hit decides not to battle Goku as thanks for lending a hand. Goku and Hit vow to settle their score if they both make it to the end of the tournament. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
