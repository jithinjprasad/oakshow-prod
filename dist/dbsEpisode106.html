  <title>Dragon Ball Super Episode 106: Find them Out! Deathmatch with a Furtive Attacker! All Ratings, Reviews &amp; Synopsis — OakShow</title>
  <meta name="description" content="Goku brings Master Roshi to an isolated part of the stage and leaves him to rest at his request. Gohan and Piccolo are confronted by Universe 6&#039;s Dr. Rota , but Rota is shot down by a sniper before he can reveal his ability. Gohan and Piccolo are unable to find the location of the sniper until they find a red orb on the ground. It is revealed that the sniper, Universe 2&#039;s Prum , can see through these orbs. The lasers ricochet off of the orbs so that his true location is a secret. Piccolo tries to create a smokescreen in order to blur the vision, but Prum can still see them via their heat signatures. Prum shoots Piccolo and destroys both of his arms, which forces him to painfully regenerate them. Gohan and Piccolo realize that the orbs depend on heat signatures and blast the surrounding area to create multiple heat signatures. Prum responds by coming out of his hiding spot and blasting the entire area. Gohan and Piccolo are forced into hiding. Tien analyzes Dr. Rota and deduces that he was hit by a sniper as Goku and Vegeta arrive. Vegeta berates Tien, who warns them about Prum, but Vegeta arrogantly brushes it off until he is almost incapacitated by one of Prum&#039;s blasts. As Goku and Tien observe Prum, they deduce that there is another shooter from behind as Prum is merely reflecting the blasts. Vegeta and Goku go after Prum, while Tien goes to save Gohan and Piccolo. Goku and Vegeta try to attack Prum, but their ki blasts are reflected off of his body. Tien navigates through the field of blasts and confronts the true sniper, Prum&#039;s teammate Hermila. Realizing that Prum can deflect ki blasts and not physical attacks, Vegeta and Goku throw giant boulders at him. Tien uses his Multi-form technique in order to buy himself time against Hermila, but three of his clones are shot down. The fourth and final Tien defeats Hermila. Just as Tien is about to eliminate him, Hermila shoots the ground underneath Tien&#039;s feet and knocks him off the stage. However, Tien&#039;s other three clones come back and drag Hermila down with them. Tien and Hermila are eliminated from the tournament. Although Beerus praises Tien for forcing the battle into a draw, Tien is noticeably upset about being defeated. As Prum is confronted by Vegeta, Dr. Rota comes back and attacks Prum as revenge for shooting him. Shortly after, Vegeta eliminates Prum and Dr. Rota from the tournament. Source:Wikipedia" />

<h1>Dragon Ball Super Episode 106: Find them Out! Deathmatch with a Furtive Attacker! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>Goku brings Master Roshi to an isolated part of the stage and leaves him to rest at his request. Gohan and Piccolo are confronted by Universe 6&#039;s Dr. Rota , but Rota is shot down by a sniper before he can reveal his ability. Gohan and Piccolo are unable to find the location of the sniper until they find a red orb on the ground. It is revealed that the sniper, Universe 2&#039;s Prum , can see through these orbs. The lasers ricochet off of the orbs so that his true location is a secret. Piccolo tries to create a smokescreen in order to blur the vision, but Prum can still see them via their heat signatures. Prum shoots Piccolo and destroys both of his arms, which forces him to painfully regenerate them. Gohan and Piccolo realize that the orbs depend on heat signatures and blast the surrounding area to create multiple heat signatures. Prum responds by coming out of his hiding spot and blasting the entire area. Gohan and Piccolo are forced into hiding. Tien analyzes Dr. Rota and deduces that he was hit by a sniper as Goku and Vegeta arrive. Vegeta berates Tien, who warns them about Prum, but Vegeta arrogantly brushes it off until he is almost incapacitated by one of Prum&#039;s blasts. As Goku and Tien observe Prum, they deduce that there is another shooter from behind as Prum is merely reflecting the blasts. Vegeta and Goku go after Prum, while Tien goes to save Gohan and Piccolo. Goku and Vegeta try to attack Prum, but their ki blasts are reflected off of his body. Tien navigates through the field of blasts and confronts the true sniper, Prum&#039;s teammate Hermila. Realizing that Prum can deflect ki blasts and not physical attacks, Vegeta and Goku throw giant boulders at him. Tien uses his Multi-form technique in order to buy himself time against Hermila, but three of his clones are shot down. The fourth and final Tien defeats Hermila. Just as Tien is about to eliminate him, Hermila shoots the ground underneath Tien&#039;s feet and knocks him off the stage. However, Tien&#039;s other three clones come back and drag Hermila down with them. Tien and Hermila are eliminated from the tournament. Although Beerus praises Tien for forcing the battle into a draw, Tien is noticeably upset about being defeated. As Prum is confronted by Vegeta, Dr. Rota comes back and attacks Prum as revenge for shooting him. Shortly after, Vegeta eliminates Prum and Dr. Rota from the tournament. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
