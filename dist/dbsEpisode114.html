<h1>Dragon Ball Super Episode 114: Bloodcurdling! The Explosive Birth of a New Super Warrior! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>Vegeta continues his battle with Top, while Caulifla is able to help Kale regain control of her Legendary Super Saiyan form. Then, Kale powers up even further into Legendary Super Saiyan 2. Caulifla and Kale battle Goku together and are able to hold him off. Meanwhile, Frieza is confronted by Katopesla, but they are interrupted by Goku&#039;s battle with Caulifla and Kale. Frieza wants to fight Caulifla and Kale, but Goku insists that he will fight them himself. Frieza backs down and watches the fight. The three Saiyans resume their battle. After unsuccessfully attempting to use Instant Transmission as a strategy, Goku powers up to his Super Saiyan God form and easily overpowers the two of them. As Goku prepares to eliminate Caulifla and Kale with a powerful Kamehameha, it is revealed that the girls were given a pair of Potara earrings by Fuwa, Universe 6&#039;s Supreme Kai. They use the earrings and fuse to become a single being with immense power, who takes the name Kefla. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
