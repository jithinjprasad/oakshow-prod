<h1>Dragon Ball Super Episode 103: The Power of Love Explodes? The 2nd Universe&#039;s Witchy Warriors! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>Brianne de Chateau and her team members Sanka Coo and Sous Roas announce themselves to the other fighters and begin to transform into their magical girl alter egos. Android 17 blasts them before they can transform, but Brianne de Chateau, Goku, and Top berate him for his dishonorable tactics and browbeat him into allowing them to transform, much to Beerus&#039; dismay. They assume their alter egos Ribrianne, Kakunsa, and Roasie and barrage the arena with a powerful love based attack that brainwashes some of the fighters. Universe Seven&#039;s mental discipline allows them to overcome its effects. Gohan&#039;s group elects to split up and fight independently. Vegeta attacks Ribrianne, who counters with a rolling attack that knocks out Universe Ten&#039;s Dyrasem. Roasie attacks Goku with a flurry of blows that grows more powerful the longer she keeps it up, while Kakunsa battles Android 17 with her animalistic fighting style. Android 17 baits her into overextending herself and stuns her with a barrier. He attempts to knock her out of the stage, but her team member, Bikal (ビカル Bikaru), rescues her. Android 17 decides to stop holding back and swiftly eliminates Bikal. He also eliminates Kakunsa with a powerful ki blast. Enraged by his actions, Ribrianne powers up and prepares to battle Android 17. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
