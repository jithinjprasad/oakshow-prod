  <title>Dragon Ball Super Episode 116: Signs of a Turnabout! The Autonomous Ultra Instinct Erupts! All Ratings, Reviews &amp; Synopsis — OakShow</title>
  <meta name="description" content="To counter Goku&#039;s increase in power, Kefla powers up to Super Saiyan 2, and the two of them face off. Goku still easily dodges Kefla&#039;s attacks, but his own attacks are not strong enough to take her down. Whis explains that when Goku launches his attacks, his conscious thoughts on deciding his attacks interfere with his concentration and prevents him from using Ultra Instinct to its full potential. Jiren senses the energy from the battle, which prompts him to awaken from his meditation and rejoin Top and Dyspo. Vegeta realizes that Ultra Instinct is the level of skill that Whis was training him and Goku to attain, and decides that he must reach it too. Goku realizes that he is running low on stamina, so he declares that he will end the fight with his next attack. Kefla panics and powers up even further, and she unleashes a multitude of deadly energy beams. Her ultimate attack devastates the ring, but Goku easily dodges her blasts while charging a Kamehameha. Goku jumps into the air, so Kefla focuses all of her power into a single blast and launches it at him, taking advantage of his apparent inability to dodge in midair. However, Goku front-flips and uses the charged-up energy to slide over her attack, and launches his Kamehameha at point-blank range, blasting Kefla out of the ring and eliminating her. Her Potara earrings shatter, and she splits back into Kale and Caulifla. With both of them eliminated, Saonel and Pilina are the only remaining warriors from Team Universe 6. Source:Wikipedia" />

<h1>Dragon Ball Super Episode 116: Signs of a Turnabout! The Autonomous Ultra Instinct Erupts! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>To counter Goku&#039;s increase in power, Kefla powers up to Super Saiyan 2, and the two of them face off. Goku still easily dodges Kefla&#039;s attacks, but his own attacks are not strong enough to take her down. Whis explains that when Goku launches his attacks, his conscious thoughts on deciding his attacks interfere with his concentration and prevents him from using Ultra Instinct to its full potential. Jiren senses the energy from the battle, which prompts him to awaken from his meditation and rejoin Top and Dyspo. Vegeta realizes that Ultra Instinct is the level of skill that Whis was training him and Goku to attain, and decides that he must reach it too. Goku realizes that he is running low on stamina, so he declares that he will end the fight with his next attack. Kefla panics and powers up even further, and she unleashes a multitude of deadly energy beams. Her ultimate attack devastates the ring, but Goku easily dodges her blasts while charging a Kamehameha. Goku jumps into the air, so Kefla focuses all of her power into a single blast and launches it at him, taking advantage of his apparent inability to dodge in midair. However, Goku front-flips and uses the charged-up energy to slide over her attack, and launches his Kamehameha at point-blank range, blasting Kefla out of the ring and eliminating her. Her Potara earrings shatter, and she splits back into Kale and Caulifla. With both of them eliminated, Saonel and Pilina are the only remaining warriors from Team Universe 6. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
