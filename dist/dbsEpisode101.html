  <meta name="description" content="As Goku prepares to fight Jiren, Top suddenly ambushes him with a barrage of ki blasts. Top and Jiren decide to retreat and conserve their stamina. This leaves Goku to be dealt with by Casserale and their fellow Pride Troopers Tupper (タッパー Tappā), Zoire (ゾイレー Zoirē), Cocotte (ココット Kokotto), and Kettle (ケットル Kettoru). The five Pride Troopers declare their intent to defeat Caulifla and Kale to avenge Vewon&#039;s defeat. Caulifla and Kale are forced to form a temporary alliance with Goku. Meanwhile, Master Roshi and Tien team up to defeat Universe Three&#039;s Za Priccio (ザ・プリーチョ Za Purīcho). They regroup with Gohan, Piccolo, Vegeta, and Frieza, where he has defeated Mulithim. The Pride Troopers push Goku, Caulifla, and Kale to the brink, but Android 17 and Android 18 rescue them. Android 18 and Goku defeat Tupper, while Android 17 easily overpowers Casserale. The remaining Pride Troopers regroup and focus their assault on the wounded Caulifla and Kale. Cocotte seals them in a separate dimension to ensure that Goku, Android 17, and Android 18 do not interfere. As the four Pride Troopers beat Caulifla, Kale&#039;s self-hatred causes her to return to the Legendary Super Saiyan form, but she is able to transform into a more stable form. Caulifla and Kale use an extremely powerful combination ki blast to defeat Casserale, Zoire, and Kettle. Cocotte seals herself in a mini-dimension to avoid the blast, but Android 18 simply throws it off and eliminates Cocotte. Goku allows Caulifla and Kale to retreat so he can fight them at their full strength after they rest. Goku, Android 17, and Android 18 are unaware that Brianne de Chateau is observing them. Source:Wikipedia" />

<h1>Dragon Ball Super Episode 101: Warriors of Justice Close In! The Pride Troopers! All Ratings, Reviews &amp; Synopsis — OakShow</h1><p>As Goku prepares to fight Jiren, Top suddenly ambushes him with a barrage of ki blasts. Top and Jiren decide to retreat and conserve their stamina. This leaves Goku to be dealt with by Casserale and their fellow Pride Troopers Tupper (タッパー Tappā), Zoire (ゾイレー Zoirē), Cocotte (ココット Kokotto), and Kettle (ケットル Kettoru). The five Pride Troopers declare their intent to defeat Caulifla and Kale to avenge Vewon&#039;s defeat. Caulifla and Kale are forced to form a temporary alliance with Goku. Meanwhile, Master Roshi and Tien team up to defeat Universe Three&#039;s Za Priccio (ザ・プリーチョ Za Purīcho). They regroup with Gohan, Piccolo, Vegeta, and Frieza, where he has defeated Mulithim. The Pride Troopers push Goku, Caulifla, and Kale to the brink, but Android 17 and Android 18 rescue them. Android 18 and Goku defeat Tupper, while Android 17 easily overpowers Casserale. The remaining Pride Troopers regroup and focus their assault on the wounded Caulifla and Kale. Cocotte seals them in a separate dimension to ensure that Goku, Android 17, and Android 18 do not interfere. As the four Pride Troopers beat Caulifla, Kale&#039;s self-hatred causes her to return to the Legendary Super Saiyan form, but she is able to transform into a more stable form. Caulifla and Kale use an extremely powerful combination ki blast to defeat Casserale, Zoire, and Kettle. Cocotte seals herself in a mini-dimension to avoid the blast, but Android 18 simply throws it off and eliminates Cocotte. Goku allows Caulifla and Kale to retreat so he can fight them at their full strength after they rest. Goku, Android 17, and Android 18 are unaware that Brianne de Chateau is observing them. Source:Wikipedia</p><p><a href="https://oakshow.in/DragonBallSuperTvSeries.html">Back to Dragon Ball Super Main Page</a></p>
