server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    resolver_timeout 5s;

    # Gzip compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static assets caching with fallback to Scalix Storage
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg)$ {
        try_files $uri @scalix_proxy;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Proxy media not found locally directly to Scalix Storage bucket
    location @scalix_proxy {
        set $scalix_backend "api.scalix.world";
        rewrite ^/(.*)$ /v1/storage/buckets/oakshow-media/objects/$1 break;
        proxy_pass https://$scalix_backend;
        proxy_set_header Host api.scalix.world;
        proxy_set_header Authorization "Bearer scalix_at_1O1s1r3G283Q402l0U2Z1N2z3o37090k2G1S2M080h382a0M3Q0X0Z453x1Q0X1e";
        proxy_set_header X-Project-Id "408d193f-88ad-4b4c-bcea-587580f4f877";
        proxy_ssl_server_name on;
        proxy_buffering off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SPA routing fallback for direct clean HTML routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
