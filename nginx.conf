server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Scalix Storage proxy for pics and logos
    location /pics/ {
        rewrite ^/pics/(.*)$ /v1/storage/buckets/oakshow-media/objects/pics/$1 break;
        proxy_pass https://api.scalix.world;
        proxy_set_header Authorization "Bearer scalix_at_1O1s1r3G283Q402l0U2Z1N2z3o37090k2G1S2M080h382a0M3Q0X0Z453x1Q0X1e";
        proxy_set_header X-Project-Id "408d193f-88ad-4b4c-bcea-587580f4f877";
        proxy_ssl_server_name on;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Scalix Storage proxy for images
    location /images/ {
        rewrite ^/images/(.*)$ /v1/storage/buckets/oakshow-media/objects/images/$1 break;
        proxy_pass https://api.scalix.world;
        proxy_set_header Authorization "Bearer scalix_at_1O1s1r3G283Q402l0U2Z1N2z3o37090k2G1S2M080h382a0M3Q0X0Z453x1Q0X1e";
        proxy_set_header X-Project-Id "408d193f-88ad-4b4c-bcea-587580f4f877";
        proxy_ssl_server_name on;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Scalix Storage proxy for favicon
    location = /favicon.png {
        rewrite ^/favicon.png$ /v1/storage/buckets/oakshow-media/objects/favicon.png break;
        proxy_pass https://api.scalix.world;
        proxy_set_header Authorization "Bearer scalix_at_1O1s1r3G283Q402l0U2Z1N2z3o37090k2G1S2M080h382a0M3Q0X0Z453x1Q0X1e";
        proxy_set_header X-Project-Id "408d193f-88ad-4b4c-bcea-587580f4f877";
        proxy_ssl_server_name on;
        proxy_buffering off;
        add_header Cache-Control "public, max-age=86400";
    }

    # Caching for Vite static assets (JS / CSS)
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
