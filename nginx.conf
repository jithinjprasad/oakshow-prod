server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Canonical redirect (will be active once SSL is provisioned for apex domain)
    # if ($host = "www.oakshow.in") {
    #     return 301 https://oakshow.in$request_uri;
    # }

    # Gzip compression for high performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Explicit Favicon handling (serves OakShow binary favicon.ico and favicon.png)
    location = /favicon.ico {
        default_type image/x-icon;
        try_files /favicon.ico /favicon.png =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location = /favicon.png {
        default_type image/png;
        try_files /favicon.png =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # SEO crawler definitions
    location = /robots.txt {
        try_files $uri =404;
        access_log off;
    }

    location = /sitemap.xml {
        try_files $uri =404;
        access_log off;
    }

    # Static assets caching with fallback to high-speed Global CDN (backed by GitHub repo)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg)$ {
        try_files $uri @media_cdn_fallback;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Redirect media not found locally directly to jsDelivr Global Edge CDN
    location @media_cdn_fallback {
        return 302 https://cdn.jsdelivr.net/gh/jithinjprasad/OakShow@main/public$request_uri;
    }

    # HTML files: never cache so users always get fresh releases and cache-busted CSS/JS
    location ~* \.html?$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # SPA routing fallback for direct clean HTML routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
